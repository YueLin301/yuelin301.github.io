name: "Build and Deploy"
on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - .gitignore
      - README.md
      - LICENSE

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one deployment pipeline at a time. A newer push may replace an older
# in-progress pipeline; the already-deployed maintenance page remains available.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  prepare_maintenance:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Prepare maintenance site
        run: |
          mkdir -p _maintenance_artifact/assets/img/avatar
          cp _maintenance/index.html _maintenance_artifact/index.html
          cp assets/img/avatar/meow5.png _maintenance_artifact/assets/img/avatar/meow5.png

      - name: Upload maintenance artifact
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-maintenance
          path: _maintenance_artifact

  deploy_maintenance:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: prepare_maintenance
    steps:
      - name: Deploy maintenance page
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-maintenance

  build:
    runs-on: ubuntu-latest
    needs: deploy_maintenance

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # submodules: true
          # If using the 'assets' git submodule from Chirpy Starter, uncomment above
          # (See: https://github.com/cotes2020/chirpy-starter/tree/main/assets)

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.2.2
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll b -d "_site${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: "production"

      - name: Test site
        run: |
          bundle exec htmlproofer _site \
            \-\-disable-external=true \
            \-\-ignore-urls "/^http:\/\/127.0.0.1/,/^http:\/\/0.0.0.0/,/^http:\/\/localhost/,/^http:\/\/www\.incompleteideas\.net\/IncIdeas\/BitterLesson\.html$/"

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "_site${{ steps.pages.outputs.base_path }}"

      # - name: Upload site artifact
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: github-pages
      #     path: "_site${{ steps.pages.outputs.base_path }}"


  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
