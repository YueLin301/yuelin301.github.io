<!-- Shared presentation styles for the standalone pages that render cv_content.html:
     index.html (maintenance) and about_me.html (/about_me/).
     The /about/ tab does NOT use this; it inherits the Chirpy theme. -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
<style>
  :root{
    --page-bg:#f7f7f9; --notice-bg:#fff; --notice-border:#e9e9ee; --notice-text:#34343c; --notice-muted:#6f6f78;
    --accent:#2a408e; --accent-contrast:#fff; --shadow:0 8px 30px rgba(20,20,40,.08);
    --cv-bg:#ffffff; --cv-text:#2c2c33; --cv-muted:#6a6a72; --cv-border:#ececf1; --cv-link:#2a408e; --cv-code-bg:#f6f8fa;
  }
  @media (prefers-color-scheme: dark){
    :root{ --page-bg:#17181b; --notice-bg:#232329; --notice-border:#34343a; --notice-text:#dcdce0; --notice-muted:#9a9aa2;
           --accent:#6f9aec; --accent-contrast:#10131c; --shadow:0 8px 30px rgba(0,0,0,.45); }
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{ background:var(--page-bg); color:var(--notice-text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue","Lato","PingFang SC","Microsoft YaHei",Arial,sans-serif;
    line-height:1.7; -webkit-font-smoothing:antialiased; padding:1.5rem; }
  .wrap{ max-width:56rem; margin:0 auto; display:flex; flex-direction:column; gap:1.4rem; }
  .card{ border-radius:14px; box-shadow:var(--shadow); }

  .notice{ background:var(--notice-bg); border:1px solid var(--notice-border); color:var(--notice-text); padding:2.2rem 2rem; text-align:center; }
  .notice .avatar{ width:76px;height:76px;border-radius:50%;object-fit:cover;border:1px solid var(--notice-border); }
  .notice .brand{ font-size:1.4rem; font-weight:700; margin:.7rem 0 .1rem; }
  .notice .domain{ color:var(--notice-muted); font-size:.85rem; margin:0 0 1.1rem; }
  .notice .status{ display:inline-flex;align-items:center;gap:.5rem;font-size:.88rem;color:var(--notice-muted);
    border:1px solid var(--notice-border);border-radius:999px;padding:.25rem .85rem;margin-bottom:1.1rem; }
  .notice .dot{ width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 1.6s ease-in-out infinite; }
  @keyframes pulse{0%,100%{opacity:.35;transform:scale(.85)}50%{opacity:1;transform:scale(1)}}
  @media (prefers-reduced-motion: reduce){.notice .dot{animation:none}}
  .notice p{ margin:0 auto .6rem; max-width:34rem; }
  .notice .dim{ color:var(--notice-muted); font-size:.95rem; }
  .notice .actions{ display:flex;flex-wrap:wrap;gap:.7rem;justify-content:center;margin-top:1.3rem; }
  .notice .btn{ text-decoration:none;font-size:.9rem;font-weight:600;padding:.55rem 1.1rem;border-radius:9px;
    border:1px solid var(--accent);transition:transform .08s,opacity .15s; }
  .notice .btn:hover{ transform:translateY(-1px);opacity:.92; }
  .notice .btn-primary{ background:var(--accent);color:var(--accent-contrast); }
  .notice .btn-ghost{ background:transparent;color:var(--accent); }
  .notice .cue{ margin-top:1.1rem;color:var(--notice-muted);font-size:.8rem; }
  .notice .contact-mini{ display:flex;flex-wrap:wrap;gap:.35rem 1.3rem;justify-content:center;margin-top:1rem;font-size:.88rem;color:var(--notice-muted); }
  .notice .contact-mini span{ white-space:nowrap; }
  .notice .contact-mini i{ opacity:.75;margin-right:.35rem; }
  .notice .contact-mini a{ color:inherit;text-decoration:none; }
  .notice .contact-mini a:hover{ text-decoration:underline; }

  /* CV card: always a light "paper" (the profile content uses light-tuned inline colors) */
  .cv{ background:var(--cv-bg); border:1px solid var(--cv-border); }
  .cv-content{ color:var(--cv-text); padding:2.2rem 2rem; overflow-wrap:break-word; }
  .cv-content a{ color:var(--cv-link); text-decoration:none; }
  .cv-content a:hover{ text-decoration:underline; }
  .cv-content h2{ font-size:1.5rem; margin:2rem 0 .8rem; padding-bottom:.35rem; border-bottom:2px solid var(--cv-border); }
  .cv-content h2:first-of-type{ margin-top:.4rem; }
  .cv-content h3{ font-size:1.15rem; margin:1.4rem 0 .6rem; color:#3a3a44; }
  .cv-content ul{ padding-left:1.3rem; }
  .cv-content li{ margin:.45rem 0; }
  .cv-content blockquote{ margin:.5rem 0; padding:.15rem 0 .15rem .9rem; border-left:4px solid var(--cv-border); color:var(--cv-muted); }
  .cv-content blockquote p{ margin:0; }
  .cv-content blockquote p + p{ margin-top:.4rem; }
  .cv-content blockquote.prompt-info{ border-left-color:#0969da; background:#ddf4ff; padding:.7rem .9rem; border-radius:6px; color:#24292f; }
  .cv-content blockquote.prompt-tip{ border-left-color:#1a7f37; background:#dafbe1; padding:.7rem .9rem; border-radius:6px; color:#24292f; }
  .cv-content pre,.cv-content pre.highlight{ background:var(--cv-code-bg); border:1px solid var(--cv-border); border-radius:8px;
    padding:.9rem 1rem; overflow:auto; font-size:.84rem; line-height:1.55; }
  .cv-content code{ font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
  .cv-content details{ margin:.5rem 0; }
  .cv-content summary{ cursor:pointer; color:var(--cv-link); font-size:.9rem; }
  .cv-content .code-header{ font-size:.8rem; color:var(--cv-muted); padding:.2rem 0; }
  .cv-content .code-header span[data-label-text]::after{ content:" " attr(data-label-text); }
  .cv-content img{ max-width:100%; height:auto; }
  .cv-content table{ border-collapse:collapse; }
  .cv-content hr{ border:none; border-top:1px solid var(--cv-border); margin:1.4rem 0; }
</style>
